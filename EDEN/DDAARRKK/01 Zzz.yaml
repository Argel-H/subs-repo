  - time_start: 590
    time_end: 5780
    original: Wow, that sounds really cool and fun, yeah
    translated: "Wow, esa canción es bastante genial, sip"
  - time_start: 5780
    time_end: 7960
    original: Last dance, are you ready or not?
    translated: "Última oportunidad, ¿estás lista o no?"
  - time_start: 7960
    time_end: 11690
    original: No chance that we make this out alive
    translated: "No hay manera de salir de esta con vida"
  - time_start: 11690
    time_end: 16230
    original: I thought we could see a way out in time
    translated: "Pensé que podríamos solucionarlo con el tiempo"
  - time_start: 16230
    time_end: 19070
    original: "But it got so dark, where'd the light go?"
    translated: "Pero todo se puso tan oscuro ¿A dónde se fue la luz?"
  - time_start: 19070
    time_end: 21660
    original: Talking so much, save the ozone
    translated: "Hablábamos un montón, cosas cómo salvar el ambiente"
  - time_start: 21660
    time_end: 27360
    original: Saying nothing except to tell me it's late (yeah)
    translated: Más que decirme excusas como "ya es tarde"
  - time_start: 27360
    time_end: 31040
    original: So I wish you sweet dreams
    translated: "Así que, te deseo dulces sueños"
  - time_start: 31040
    time_end: 33850
    original: If you want to sleep on me, yeah
    translated: "Si quieres dormir sobre mí"
  - time_start: 33850
    time_end: 35550
    original: "No tears in the mornin'"
    translated: "Adelante, será sin lágrimas por la mañana"
  - time_start: 35550
    time_end: 38910
    original: "It's alright, it's alright"
    translated: "Está bien, lo aceptaré"
  - time_start: 38910
    time_end: 41960
    original: "It's all just sweet dreams"
    translated: "Todos son sólo dulces sueños"
  - time_start: 41960
    time_end: 44870
    original: "And you're sleeping on me"
    translated: "Y tú sólo me sigues ignorando"
  - time_start: 44870
    time_end: 47420
    original: "Even though it's not real"
    translated: "Incluso cuando no es algo real"
