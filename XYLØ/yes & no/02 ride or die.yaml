lyrics:
  - time_start: 6090
    time_end: 8850
    original: Yeah, I think it's cute when you tell me lies
    translated: Sí, me parece lindo cuando me mientes
    locked: false
  - time_start: 8850
    time_end: 11340
    original: Always let you win when I know I'm right
    translated: Siempre te dejo ganar sabiendo que tengo razón
    locked: false
  - time_start: 11340
    time_end: 14010
    original: Backseat in the coupe with the suicide
    translated: Atrás en el cupé con puertas suicidas
    locked: false
  - time_start: 14010
    time_end: 16740
    original: Then we get a little high, get a little high
    translated: Para luego enloquecemos un poco, un poquito más
    locked: false
  - time_start: 16740
    time_end: 19600
    original: 7 nights in the car (car)
    translated: Siete noches en el auto (auto)
    locked: false
    comment: El auto no es el problema per se; es una metáfora de estar atrapados siempre de noche en un espacio reducido. Es en un entorno como este donde los conflictos comienzan.
  - time_start: 19600
    time_end: 22090
    original: And the lights are getting dark (dark)
    translated: Y las luces se comienzan a oscurecer (oscurecer)
    locked: false
    comment: La relación se deja de ver con claridad.
  - time_start: 22090
    time_end: 24790
    original: We can take it too far (far)
    translated: Podemos llegar demasiado lejos (lejos)
    locked: false
    comment: A falta de luz la claridad en la relación y eso podría hacer que se rompan limites definidos; creando así un ciclo toxico.
  - time_start: 24790
    time_end: 27340
    original: I'll be with you forever
    translated: Pero estaré contigo para siempre
    locked: false
  - time_start: 27340
    time_end: 31800
    original: All I wanna do, all I wanna do is ride with you
    translated: Todo lo que quiero, todo lo que quiero es seguir a tu lado
    locked: false
    comment: "[ride or die](https://www.urbandictionary.com/define.php?term=ride+or+die) se define como recorrer el camino juntos o <u>morir en el intento</u>; pero siempre seguir uno al lado del otro."
