    original: As I grew
    translated: Mientras crecía
  - time_start: 18840
    time_end: 24810
    original: From your supple hands
    translated: En la calidez de tus manos
  - time_start: 24810
    time_end: 29870
    original: I could be a burden
    translated: Podía ser una carga
  - time_start: 29870
    time_end: 34580
    original: "But you'd understand"
    translated: Pero siempre lo comprendías
  - time_start: 34580
    time_end: 39210
    original: "Though the child's gone"
    translated: Aunque ya haya crecido
  - time_start: 39210
    time_end: 44490
    original: "I'm still a mixed-up kid"
    translated: Sigo siendo un niño confundido
  - time_start: 44490
    time_end: 48760
    original: "It's like I need you now"
    translated: Y necesito tu ayuda
  - time_start: 48760
    time_end: 55310
    original: Like I never did
    translated: Como nunca la necesité
  - time_start: 55310
    time_end: 60540
    original: "Life's got me tumbling down the stairs again, unusually blue"
    translated: La vida me tiene cayendo por las escaleras otra vez, haciéndome sentir muy triste
  - time_start: 60540
    time_end: 64810
    original: "I've been scratched up and bruised"
    translated: Me he golpeado y arañado
  - time_start: 64810
    time_end: 69970
    original: "Just as I'm asking for some help again, you already knew"
    translated: Justo cuando vuelvo a pedir ayuda, tú ya sabías que...
  - time_start: 69970
    time_end: 72990
    original: I feel thrown out and used
    translated: Me siento desechado y utilizado
  - time_start: 72990
    time_end: 77900
    original: "There's nothing like your eyes to recognize my pain"
    translated: No hay nada como tu mirada para reconocer mi dolor
  - time_start: 77900
    time_end: 80100
    original: Uncovering the lies
    translated: Poniendo al descubierto las mentiras
  - time_start: 80100
    time_end: 83030
    original: I told myself in vain
    translated: Que me conté a mí mismo en vano
  - time_start: 83030
    time_end: 84940
    original: Nothing like your hand
    translated: No hay nada como tus manos
  - time_start: 84940
    time_end: 87380
