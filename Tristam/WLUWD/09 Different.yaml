  - time_start: 17990
    time_end: 22670
    original: Laying here pretty, still to my feet
    translated: Estando aquí acostado, vulnerable hasta los pies
  - time_start: 22670
    time_end: 27440
    original: "Can you really blame me if I'd rather sleep?"
    translated: ¿Es tan malo que prefiera dormir en lugar de hacer cualquier cosa?
  - time_start: 27440
    time_end: 31590
    original: "If you're so lucky to hear me complain"
    translated: Si eres el afortunado de escuchar mis quejas
  - time_start: 31590
    time_end: 36400
    original: "Hold up my head and I'll swallow my pain"
    translated: Mantendré mi cabeza en alto y soportaré el dolor
  - time_start: 36400
    time_end: 40480
    original: "Look at me funny and I'll hear out your jokes"
    translated: No te preocupes por ofenderme, igual escucharé tus chistes
  - time_start: 40480
    time_end: 47370
    original: "My mamma once told me I'm golden and special, and I know"
    translated: Mi mamá me dijo una vez que soy valioso y especial, y lo sé
  - time_start: 47370
    time_end: 53160
    original: "I know it's true"
    translated: Sé que no se equivoca.
  - time_start: 53160
    time_end: 56310
    original: "And though, I'm a little bit different"
    translated: Y aunque, soy un poco diferente
  - time_start: 56310
    time_end: 58520
    original: You could never really make a dent
    translated: Nunca podrás cambiar eso de mí
  - time_start: 58520
    time_end: 60610
    original: Take away my only different
    translated: No permitiré que me quiten lo que me define
