    original: "I could give it all if you'd take me"
    translated: (Lo daría todo si me llevaras)
  - time_start: 25150
    time_end: 30110
    original: To when I was a kid in the backseat
    translated: A cuando era niño en el asiento trasero
  - time_start: 30110
    time_end: 33720
    original: Driven down a road in the country
    translated: Conducido por una carretera en el campo (a lo lejos, a lo lejos, a lo lejos)
  - time_start: 33720
    time_end: 34900
    original: "I'd want to grow"
    translated: Quería crecer
  - time_start: 34900
    time_end: 40040
    original: So I could take a ride in the front seat
    translated: Para pasear en el asiento delantero
  - time_start: 40040
    time_end: 44960
    original: Never knew that time would escape me
    translated: Nunca supe que el tiempo me escaparía
  - time_start: 44960
    time_end: 48420
    original: I could give all just to break free
    translated: Lo daría todo solo para liberarme
  - time_start: 48420
    time_end: 53380
