  - time_start: 54630
    time_end: 60510
    original: Did you know, the streets are colder now
    translated: ¿Sabías que las calles están más frías ahora
  - time_start: 60510
    time_end: 67270
    original: Than they have ever been? Would you let me in?
    translated: de lo que nunca han sido? ¿Me dejarías entrar?
  - time_start: 67270
    time_end: 73720
    original: "I'm invisible, you walk right on through"
    translated: Soy como un fantasma, pasas a través de mí
  - time_start: 73720
    time_end: 80630
    original: "Like I wasn't there, like you didn't care"
    translated: Como si no existiera allí, como si no te importara
  - time_start: 80630
    time_end: 87130
    original: All we ask is for your eyes to see us, not for our disguise
    translated: Todo lo que pedimos a tus ojos es que nos vean, más allá de nuestro disfraz
  - time_start: 87130
    time_end: 93580
    original: "To hear our beckon, hear our cries, why can't you stop to meet our eyes?"
    translated: ¿Por qué sigues ignorando nuestras miradas?
