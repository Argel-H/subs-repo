    locked: false
    comment: "[Musixmatch](https://www.musixmatch.com/lyrics/The-Neighbourhood/You-Get-Me-So-High#:~:text=Never%20knew%20I%20needed%20you%20though%2C%20so) es una fuente verificada de letras; una vez la letra esté bloqueada es porque el artista subió la letra original; por eso utilicé estas letras. En Musixmatch dice **\"I needed you\"**, en otras fuentes comunitarias dicen <u>\"I meet you\"</u>."
